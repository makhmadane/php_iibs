# ====================================
# CONFIGMAP - Stockage de fichiers de configuration
# ====================================
# Un ConfigMap permet de stocker des configurations non-sensibles :
# - Fichiers de configuration (nginx.conf, php.ini, etc.)
# - Variables d'environnement
# - Paramètres de l'application
#
# Différence avec Docker :
# Dans Docker, vous utilisiez COPY dans le Dockerfile :
#   COPY default.conf /etc/nginx/conf.d/default.conf
#
# Problème : Si vous voulez changer la config, il faut :
#   1. Modifier le fichier
#   2. Rebuild l'image Docker
#   3. Redéployer le conteneur
#
# Avec ConfigMap :
#   1. Vous modifiez le ConfigMap
#   2. Redémarrez le pod (ou utilisez le rechargement à chaud)
#   -> Pas besoin de rebuilder l'image !
#
# Le ConfigMap sera monté comme un volume dans le pod Nginx
# ====================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: php-iibs
  labels:
    app: nginx
data:
  # Clé : nom du fichier
  # Valeur : contenu du fichier
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        root /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            # IMPORTANT : Dans Kubernetes, on utilise le nom du Service
            # au lieu du nom du conteneur Docker Compose
            # Docker Compose : php-iibs2:9000
            # Kubernetes : php-service.php-iibs.svc.cluster.local:9000
            # ou simplement : php-service:9000 (car ils sont dans le même namespace)
            fastcgi_pass php-service:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
