# ====================================
# SECRET - Stockage sécurisé des données sensibles
# ====================================
# Un Secret Kubernetes permet de stocker des informations sensibles comme :
# - Mots de passe
# - Tokens d'API
# - Certificats SSL
#
# Différence avec Docker Compose :
# Dans docker-compose.yml, vous aviez :
#   environment:
#     MYSQL_ROOT_PASSWORD: root
#     MYSQL_PASSWORD: secret
#
# PROBLÈME : Ces mots de passe sont en clair dans le fichier !
#
# Avec Kubernetes Secret :
# - Les valeurs sont encodées en base64 (pas chiffré, mais pas en clair)
# - Peuvent être chiffrées au repos (encryption at rest)
# - Meilleures pratiques de sécurité
#
# Comment encoder en base64 :
#   Linux/Mac: echo -n "root" | base64
#   Windows PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("root"))
#
# Valeurs actuelles encodées :
#   "root" -> cm9vdA==
#   "secret" -> c2VjcmV0
#   "php_iibs_db" -> cGhwX2lpYnNfZGI=
#   "phpuser" -> cGhwdXNlcg==
# ====================================

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: php-iibs
  labels:
    app: mysql
type: Opaque
data:
  # ATTENTION : Ces valeurs doivent être encodées en base64
  # Pour des raisons de sécurité, en production utilisez des outils comme
  # Sealed Secrets, External Secrets Operator, ou HashiCorp Vault

  MYSQL_ROOT_PASSWORD: cm9vdA==        # "root" en base64
  MYSQL_DATABASE: cGhwX2lpYnNfZGI=     # "php_iibs_db" en base64
  MYSQL_USER: cGhwdXNlcg==              # "phpuser" en base64
  MYSQL_PASSWORD: c2VjcmV0              # "secret" en base64
