# ====================================
# DEPLOYMENT PHP-FPM
# ====================================
# Ce Deployment crée les Pods PHP-FPM qui exécutent votre code PHP.
#
# Différence avec MySQL :
# - PHP-FPM est "stateless" (sans état) : pas de données à persister
# - On peut avoir plusieurs réplicas pour la haute disponibilité
# - Plus facile à scaler horizontalement
#
# Volumes partagés avec Nginx :
# IMPORTANT : Dans Docker Compose, vous aviez :
#   volumes:
#     - ./:/var/www/html
#
# Le même volume était monté dans nginx ET php-fpm pour partager les fichiers PHP.
#
# Dans Kubernetes, il y a plusieurs solutions :
# 1. EmptyDir : Volume temporaire partagé entre conteneurs d'un même Pod
# 2. ConfigMap : Pour de petits fichiers (limité à 1MB)
# 3. PVC : Pour des volumes persistants partagés (ReadWriteMany)
# 4. Init Container : Copier les fichiers au démarrage
# 5. Sidecar : Conteneur qui synchronise les fichiers
#
# Pour cet exemple, nous utiliserons un ConfigMap pour index.php
# En production, vous pourriez :
# - Builder les fichiers PHP dans l'image Docker
# - Utiliser un PVC avec ReadWriteMany (NFS, CephFS, etc.)
# - Utiliser un système de CI/CD pour déployer les fichiers
# ====================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: php-files
  namespace: php-iibs
  labels:
    app: php
data:
  # On stocke le fichier index.php ici
  # En production, vous incluriez ces fichiers dans l'image Docker
  index.php: |
    <?php

        echo "iibs";

        echo "THIES";
    ?>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-deployment
  namespace: php-iibs
  labels:
    app: php
    tier: backend
spec:
  # On peut avoir plusieurs réplicas de PHP-FPM pour la scalabilité
  replicas: 2

  selector:
    matchLabels:
      app: php
      tier: backend

  template:
    metadata:
      labels:
        app: php
        tier: backend
    spec:
      containers:
      - name: php-fpm
        # Dans Docker Compose, vous construisiez l'image avec "build: ./php"
        # Dans Kubernetes, vous devez :
        # 1. Builder l'image : docker build -t votre-registry/php-iibs:v1 ./php
        # 2. Pusher l'image : docker push votre-registry/php-iibs:v1
        # 3. Référencer l'image ici
        #
        # Pour cet exemple, on va recréer l'image avec les bonnes commandes
        # Vous pouvez utiliser :
        # - Docker Hub : username/php-iibs:v1
        # - GitHub Container Registry : ghcr.io/username/php-iibs:v1
        # - Registry privé : registry.example.com/php-iibs:v1
        #
        # Pour l'instant, utilisons l'image de base et installons les extensions au runtime
        # (Pas idéal pour la production, mais permet de tester rapidement)
        image: php:8.2-fpm

        ports:
        - containerPort: 9000
          name: php-fpm

        # Volume pour les fichiers PHP
        volumeMounts:
        - name: php-files
          mountPath: /var/www/html

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        # Liveness Probe : Vérifier que PHP-FPM répond
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness Probe : Vérifier que PHP-FPM est prêt
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      # Init Containers : Conteneurs qui s'exécutent AVANT le conteneur principal
      # Utile pour :
      # - Installer des dépendances
      # - Attendre qu'un service soit prêt
      # - Copier des fichiers
      initContainers:
      - name: install-php-extensions
        image: php:8.2-fpm
        command:
        - sh
        - -c
        - |
          # Installer les extensions PHP nécessaires
          docker-php-ext-install pdo pdo_mysql mysqli
          # Copier les extensions compilées vers un volume partagé
          # (Dans cet exemple simplifié, on les installe directement dans l'image)
          echo "Extensions PHP installées"
        # Note : Cette approche n'est pas idéale en production
        # Il vaut mieux créer une image Docker personnalisée avec les extensions
        # Voir ci-dessous pour les instructions

      volumes:
      - name: php-files
        configMap:
          name: php-files

# ====================================
# NOTE IMPORTANTE : CRÉATION D'IMAGE PERSONNALISÉE
# ====================================
# Pour une vraie production, vous devez créer votre propre image Docker.
#
# Étapes :
# 1. Builder l'image localement :
#    cd php/
#    docker build -t votre-username/php-iibs:v1 .
#
# 2. Pusher vers un registry :
#    docker login
#    docker push votre-username/php-iibs:v1
#
# 3. Mettre à jour ce fichier :
#    image: votre-username/php-iibs:v1
#
# 4. Supprimer l'initContainer (plus nécessaire)
#
# Avantages :
# - Démarrage plus rapide (extensions déjà installées)
# - Reproductibilité (même image partout)
# - Sécurité (contrôle de ce qui est dans l'image)
# ====================================

---
apiVersion: v1
kind: Service
metadata:
  name: php-service
  namespace: php-iibs
  labels:
    app: php
spec:
  type: ClusterIP
  selector:
    app: php
    tier: backend
  ports:
  - name: php-fpm
    protocol: TCP
    port: 9000
    targetPort: 9000

# ====================================
# EXPLICATION : Communication Nginx <-> PHP-FPM
# ====================================
# Dans Docker Compose :
#   nginx utilise "php-iibs2:9000" pour parler à PHP-FPM
#
# Dans Kubernetes :
#   nginx utilise "php-service:9000"
#
# Comment ça marche ?
# 1. Nginx fait une requête à "php-service:9000"
# 2. Le DNS de Kubernetes résout "php-service" vers l'IP du Service
# 3. Le Service load-balance entre tous les Pods PHP (2 réplicas)
# 4. Le Pod PHP traite la requête et retourne la réponse
#
# DNS complet : php-service.php-iibs.svc.cluster.local
# DNS court (même namespace) : php-service
# ====================================
