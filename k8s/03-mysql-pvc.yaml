# ====================================
# PERSISTENTVOLUMECLAIM (PVC) - Demande de stockage persistant
# ====================================
# Un PVC est une "demande" de stockage dans Kubernetes.
#
# Concept de stockage dans Kubernetes :
# 1. PersistentVolume (PV) : Le stockage réel (disque physique, NFS, cloud storage)
# 2. PersistentVolumeClaim (PVC) : Une demande de stockage (comme une "réservation")
# 3. Le PVC est ensuite monté dans un Pod
#
# Analogie avec Docker :
# Dans docker-compose.yml, vous aviez :
#   volumes:
#     mysql_data:/var/lib/mysql
#
# Docker crée automatiquement un volume nommé "mysql_data"
#
# Dans Kubernetes :
# - Vous créez un PVC qui "demande" X Go de stockage
# - Kubernetes trouve (ou crée) un PV qui correspond à la demande
# - Le PVC est ensuite monté dans le Pod MySQL
#
# Avantages :
# - Abstraction : Vous ne vous souciez pas d'où vient le stockage
# - Portabilité : Le même PVC fonctionne sur différents clusters
# - Lifecycle indépendant : Les données persistent même si le Pod est supprimé
#
# Access Modes :
# - ReadWriteOnce (RWO) : Un seul nœud peut monter le volume en lecture/écriture
# - ReadOnlyMany (ROX) : Plusieurs nœuds peuvent monter en lecture seule
# - ReadWriteMany (RWX) : Plusieurs nœuds peuvent monter en lecture/écriture
#
# Pour MySQL, on utilise RWO car une seule instance écrit à la fois
# ====================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: php-iibs
  labels:
    app: mysql
spec:
  accessModes:
    - ReadWriteOnce  # Un seul pod peut écrire à la fois (parfait pour MySQL)
  resources:
    requests:
      storage: 1Gi   # Demande 1 Go de stockage (ajustez selon vos besoins)
  # storageClassName: standard  # Utilisez la storage class par défaut de votre cluster
  # Exemples de storage classes :
  #   - "standard" (disque HDD sur cloud)
  #   - "fast" (SSD)
  #   - "nfs" (stockage réseau)
  # Si non spécifié, utilise la storage class par défaut du cluster
