# ====================================
# NAMESPACE - Espace de noms Kubernetes
# ====================================
# Un Namespace est comme un "dossier virtuel" dans Kubernetes qui permet
# d'isoler et d'organiser vos ressources (pods, services, etc.)
#
# Avantages :
# - Isolation logique des ressources
# - Séparation des environnements (dev, prod, etc.)
# - Gestion des quotas et permissions par namespace
# - Évite les conflits de noms entre projets
#
# Dans Docker Compose, on n'a pas vraiment d'équivalent, tout est dans le même "espace".
# ====================================

apiVersion: v1
kind: Namespace
metadata:
  name: php-iibs
  labels:
    app: php-iibs
    environment: development
